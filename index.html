<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>বঙ্গনারী — কালেকশন ক্যাটালগ</title>
  <style>
    :root {
      --bg-page: #faf7f5;
      --bg-card: #ffffff;
      --ink-main: #1f161a;
      --ink-muted: #65555c;
      --maroon: #800020;
      --maroon-dark: #590016;
      --emerald-premium: #0f6b4e;
      --selected-ink: #ffffff;
      --border-soft: #eadce0;
      --accent-soft: #fdf2f4;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      color: var(--ink-main);
      padding-bottom: 112px;
      line-height: 1.45;
    }

    /* আরও বড় ও নিচের দিকে লম্বা ওয়েলকাম ব্যানার */
    .hero-banner {
      width: 100%;
      min-height: 360px;
      background: linear-gradient(135deg, var(--maroon), var(--maroon-dark));
      position: relative;
      overflow: hidden;
    }

    .hero-banner img {
      width: 100%;
      min-height: 360px;
      max-height: 520px;
      object-fit: cover;
      display: block;
    }

    /* মূল কন্টেইনার */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px;
    }

    /* টপ নেভিগেশন */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      min-height: 44px;
    }

    .back-nav-btn {
      background: #fff;
      border: 1.5px solid var(--border-soft);
      color: var(--maroon);
      font-weight: 800;
      font-size: 1.1rem;
      padding: 9px 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    .status-info {
      font-size: 1.3rem;
      color: var(--ink-main);
      font-weight: 800;
    }

    .section-title {
      font-size: 1.65rem;
      font-weight: 900;
      margin: 16px 0 12px;
      color: var(--ink-main);
    }

    /* এক লাইনে ২টি করে ক্যাটাগরি কার্ড (শাড়ি ও ব্লাউজ ওপরে, কুর্তি নিচে) */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .cat-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: 14px;
      overflow: hidden;
      text-align: center;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 3px 8px rgba(128, 0, 32, 0.08);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .cat-card:active {
      transform: scale(0.98);
    }

    .cat-card.active {
      border-color: var(--maroon);
      background: var(--accent-soft);
    }

    .cat-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    .cat-label {
      padding: 12px 6px;
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--ink-main);
    }

    /* দামের ভাগ ও ভেতরের ধরন ফিল্টার চিপস */
    .filter-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 12px 0;
    }

    .filter-chip {
      background: #fff;
      border: 1.5px solid #d5c2c8;
      color: var(--ink-main);
      padding: 10px 15px;
      border-radius: 24px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--maroon);
      color: #fff;
      border-color: var(--maroon);
    }

    /* মোবাইলে এক লাইনে ২টি করে প্রোডাক্ট কার্ড */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
    }

    /* কার্ডে প্রথমে ১টি ছবি ও ওপরের দিকে '২টি ছবি আছে' ব্যাজ */
    .img-single-wrap {
      position: relative;
      width: 100%;
      background: #f3ecee;
      cursor: pointer;
    }

    .img-single-wrap img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
    }

    .two-photo-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(25, 16, 20, 0.8);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 12px;
    }

    /* পুরো সাদা অংশই ক্লিকেবল সিলেক্ট এরিয়া */
    .prod-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      justify-content: space-between;
      cursor: pointer;
      background: var(--bg-card);
    }

    .prod-code-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: var(--ink-muted);
      font-weight: 700;
    }

    .prod-price-center {
      text-align: center;
      font-size: 1.95rem;
      font-weight: 900;
      color: var(--maroon);
      line-height: 1.15;
      padding: 2px 0;
    }

    .prod-type {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--ink-main);
      line-height: 1.25;
      text-align: center;
    }

    .select-btn {
      margin-top: 4px;
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 11px 8px;
      font-size: 1.12rem;
      font-weight: 800;
      cursor: pointer;
      background-color: var(--maroon);
      color: #ffffff;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .select-btn.is-selected {
      background-color: var(--emerald-premium);
      color: var(--selected-ink);
    }

    .red-tick {
      color: #ff2a2a;
      font-weight: 900;
      font-size: 1.2rem;
      text-shadow: 0 0 2px rgba(255, 255, 255, 0.85);
    }

    /* বড় করে দেখার ভিউ (Lightbox / Modal) */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(15, 10, 13, 0.96);
      z-index: 900;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      color: #fff;
    }

    .lightbox.open {
      display: flex;
    }

    .lb-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      color: #e5d8dc;
    }

    .lb-stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
      overflow: hidden;
    }

    .lb-stage img {
      max-width: 100%;
      max-height: 54vh;
      border-radius: 10px;
      object-fit: contain;
      background: #000;
    }

    .lb-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.35rem;
      font-weight: bold;
      cursor: pointer;
    }

    .lb-nav-btn.prev { left: 6px; }
    .lb-nav-btn.next { right: 6px; }

    .lb-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .lb-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }

    .lb-dot.active {
      background: #fbbf24;
    }

    .lb-back-bottom-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .lb-back-btn {
      width: 100%;
      background: #ffffff;
      color: var(--maroon-dark);
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 900;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .lb-footer {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
    }

    .lb-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 1.25rem;
    }

    /* নিচের ফিক্সড বার: ৫০% / ৫০% ভাগ */
    .sticky-cart-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top: 2px solid var(--border-soft);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.14);
      padding: 8px 10px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 800;
    }

    .sticky-cart-bar.visible {
      display: flex;
    }

    .cart-note-box {
      position: relative;
      flex: 1;
      width: 50%;
      min-width: 0;
      height: 64px;
      border-radius: 10px;
      overflow: hidden;
      background: #fff6e5;
      border: 1px solid #f3c677;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }

    .cart-note-box img.note-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .cart-note-overlay {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .live-count-badge {
      background: var(--maroon);
      color: #fff;
      font-weight: 900;
      font-size: 1.05rem;
      min-width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      flex-shrink: 0;
    }

    .cart-note-text {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--ink-main);
      background: rgba(255, 255, 255, 0.88);
      padding: 3px 6px;
      border-radius: 6px;
      line-height: 1.25;
    }

    .wa-img-btn {
      flex: 1;
      width: 50%;
      height: 64px;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 10px;
      overflow: visible;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wa-img-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .wa-fallback-label {
      position: absolute;
      inset: 0;
      background: #25d366;
      color: #fff;
      font-weight: 900;
      font-size: 1.05rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      text-align: center;
      pointer-events: none;
    }

    @keyframes waFirstAttention {
      0%   { transform: translateY(0) scale(1) rotate(0deg); }
      22%  { transform: translateY(-10px) scale(1.06) rotate(-2deg); }
      40%  { transform: translateY(-10px) scale(1.06) rotate(2.5deg); }
      58%  { transform: translateY(-9px) scale(1.05) rotate(-2deg); }
      76%  { transform: translateY(-6px) scale(1.03) rotate(1.5deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }

    .wa-img-btn.first-pop-shake {
      animation: waFirstAttention 0.75s ease-in-out;
    }

    /* এক্সিট কনফার্মেশন পপ-আপ */
    .exit-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.74);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .exit-modal.open {
      display: flex;
    }

    .exit-card {
      width: 100%;
      max-width: 420px;
      min-height: 52vh;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }

    .exit-msg {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--ink-main);
      margin: auto 0;
      line-height: 1.55;
    }

    .exit-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-stay {
      background: var(--maroon);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-leave {
      background: #f1e6e9;
      color: var(--ink-main);
      border: 1px solid #d8c2c8;
      border-radius: 12px;
      padding: 13px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-box {
      background: #fff;
      border: 1px dashed var(--border-soft);
      border-radius: 12px;
      padding: 24px 14px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 1.15rem;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- বড় ও নিচের দিকে লম্বা ওয়েলকাম ব্যানার -->
  <header class="hero-banner">
    <img src="images/banner.jpg" alt="বঙ্গনারী ব্যানার" onerror="this.style.display='none'" />
  </header>

  <main class="container">
    <div class="top-bar">
      <button id="backBtn" class="back-nav-btn" style="display:none;" onclick="goBackStep()">← আগের ধাপ</button>
      <span id="statusInfo" class="status-info">ক্যাটাগরি বেছে নিন</span>
    </div>

    <!-- ক্যাটাগরি গ্রিড (ক্রম: শাড়ি, ব্লাউজ, কুর্তি -> ২ কলামে শাড়ি-ব্লাউজ ওপরে, কুর্তি নিচে) -->
    <section id="categorySection">
      <div class="section-title">ক্যাটাগরি</div>
      <div id="categoryGrid" class="category-grid"></div>
    </section>

    <!-- দামের ভাগ -->
    <section id="priceSection" style="display:none;">
      <div class="section-title" id="priceHeading">দামের ভাগ</div>
      <div id="priceChips" class="filter-strip"></div>
    </section>

    <!-- ভেতরের ধরন / সাব-ক্যাটাগরি ও প্রোডাক্ট তালিকা -->
    <section id="productSection" style="display:none;">
      <div class="section-title" id="typeHeading">ধরন অনুযায়ী দেখুন</div>
      <div id="typeChips" class="filter-strip"></div>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <!-- বড় করে দেখার ভিউ (Lightbox) -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
    <div class="lb-top">
      <span id="lbSerial" style="font-weight:700;"></span>
      <span id="lbSlideCounter" style="font-weight:700;">১ / ২</span>
    </div>

    <div class="lb-stage" id="lbStage">
      <button class="lb-nav-btn prev" onclick="changeLbSlide(-1)" aria-label="আগের ছবি">‹</button>
      <img id="lbImg" src="" alt="প্রোডাক্টের বড় ছবি" />
      <button class="lb-nav-btn next" onclick="changeLbSlide(1)" aria-label="পরের ছবি">›</button>
    </div>

    <div>
      <div class="lb-dots" id="lbDots"></div>

      <div class="lb-back-bottom-wrap">
        <button type="button" class="lb-back-btn" onclick="closeLightbox(true)">← ফিরে যান</button>
      </div>

      <div class="lb-footer">
        <div class="lb-info-row">
          <span id="lbTitle"></span>
          <span id="lbPrice" style="color:#fbbf24;"></span>
        </div>
        <button id="lbSelectBtn" class="select-btn"></button>
      </div>
    </div>
  </div>

  <!-- নিচের ফিক্সড বার (৫০% / ৫০%) -->
  <div id="stickyCartBar" class="sticky-cart-bar">
    <div class="cart-note-box">
      <img class="note-bg" src="images/cart-note.jpg" alt="" onerror="this.style.display='none'" />
      <div class="cart-note-overlay">
        <span id="liveCountBadge" class="live-count-badge">০</span>
        <span id="liveCountText" class="cart-note-text">পছন্দ হয়েছে, আরও বেছে নিতে পারেন</span>
      </div>
    </div>

    <button id="waOrderBtn" type="button" class="wa-img-btn" onclick="sendOrderToWhatsApp()" aria-label="WhatsApp-এ অর্ডার প্লেস করুন">
      <img
        src="images/wa-btn.png"
        alt="WhatsApp-এ অর্ডার প্লেস করুন"
        onload="if (this.nextElementSibling) this.nextElementSibling.style.display='none';"
        onerror="this.style.display='none';"
      />
      <span class="wa-fallback-label">WhatsApp-এ অর্ডার</span>
    </button>
  </div>

  <!-- এক্সিট কনফার্মেশন পপ-আপ -->
  <div id="exitModal" class="exit-modal" role="dialog" aria-modal="true">
    <div class="exit-card">
      <div class="exit-msg">
        আপনি যদি এখন বেরিয়ে যান, তবে সিলেক্ট করা প্রোডাক্টগুলো বাতিল হয়ে যাবে।
      </div>
      <div class="exit-actions">
        <button type="button" class="btn-stay" onclick="stayOnSite()">থেকে যাবো</button>
        <button type="button" class="btn-leave" onclick="confirmLeaveSite()">বেরিয়ে যাবো</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ১. কনফিগারেশন
    // ==========================================
    const CONFIG = {
      whatsappNumber: "919398452384",
      imageFolder: "images",
      googleSheetCsvUrl: ""
    };

    // শাড়ি ও ব্লাউজ প্রথম লাইনে, কুর্তি নিচের লাইনে
    const CATEGORIES = [
      { id: "saree", name: "শাড়ি", image: "images/cat-saree.jpg" },
      { id: "blouse", name: "ব্লাউজ", image: "images/cat-blouse.jpg" },
      { id: "kurti", name: "কুর্তি", image: "images/cat-kurti.jpg" }
    ];

    const PRICE_FILTERS_BY_CAT = {
      saree: [
        { id: "all", label: "সব দাম", max: Infinity },
        { id: "under-300", label: "৩০০ টাকার মধ্যে", max: 300 },
        { id: "under-500", label: "৫০০ টাকার মধ্যে", max: 500 },
        { id: "under-700", label: "৭০০ টাকার মধ্যে", max: 700 },
        { id: "under-1000", label: "১০০০ টাকার মধ্যে", max: 1000 }
      ],
      kurti: [
        { id: "all", label: "সব দাম", max: Infinity },
        { id: "under-200", label: "২০০ টাকার মধ্যে", max: 200 },
        { id: "under-500", label: "৫০০ টাকার মধ্যে", max: 500 },
        { id: "under-700", label: "৭০০ টাকার মধ্যে", max: 700 }
      ],
      blouse: [
        { id: "all", label: "সব দাম", max: Infinity },
        { id: "under-200", label: "২০০ টাকার মধ্যে", max: 200 },
        { id: "under-500", label: "৫০০ টাকার মধ্যে", max: 500 },
        { id: "under-700", label: "৭০০ টাকার মধ্যে", max: 700 }
      ]
    };

    const DEFAULT_PRICE_FILTERS = [
      { id: "all", label: "সব দাম", max: Infinity },
      { id: "under-300", label: "৩০০ টাকার মধ্যে", max: 300 },
      { id: "under-500", label: "৫০০ টাকার মধ্যে", max: 500 },
      { id: "under-700", label: "৭০০ টাকার মধ্যে", max: 700 },
      { id: "under-1000", label: "১০০০ টাকার মধ্যে", max: 1000 }
    ];

    const SAMPLE_PRODUCTS = [
      { serial: "0001", category: "saree", type: "জামদানি", price: 450 },
      { serial: "0002", category: "saree", type: "বেনারসি", price: 680 },
      { serial: "0003", category: "saree", type: "জামদানি", price: 290 },
      { serial: "0004", category: "saree", type: "তাঁত", price: 890 },
      { serial: "0005", category: "kurti", type: "কটন কুর্তি", price: 190 },
      { serial: "0006", category: "kurti", type: "রেয়ন কুর্তি", price: 480 },
      { serial: "0007", category: "blouse", type: "কটন ব্লাউজ", price: 180 },
      { serial: "0008", category: "blouse", type: "ডিজাইনার ব্লাউজ", price: 490 }
    ];

    // ==========================================
    // ২. হালকা সাউন্ড এফেক্ট
    // ==========================================
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTingSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(1046.5, now);
        osc.frequency.exponentialRampToValueAtTime(1318.5, now + 0.08);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.06, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {}
    }

    function playFirstWaNoticeSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        [880, 1174.66].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + idx * 0.09;

          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.055, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.24);
        });
      } catch (e) {}
    }

    // ==========================================
    // ৩. সেশন স্টেট
    // ==========================================
    let allProducts = [...SAMPLE_PRODUCTS];
    let currentCategory = null;
    let currentPriceFilter = DEFAULT_PRICE_FILTERS[0];
    let currentTypeFilter = "all";
    const selectedMap = new Map();
    let hasPlayedFirstWaAnimation = false;

    let lbProduct = null;
    let lbSlideIndex = 0;
    let lbOpenedFromHistory = false;
    let ignoreNextPopstate = false;
    let exitPromptArmed = false;

    function getActivePriceFilters() {
      return PRICE_FILTERS_BY_CAT[currentCategory] || DEFAULT_PRICE_FILTERS;
    }

    function getProductImages(serial) {
      return [
        `${CONFIG.imageFolder}/${serial}-1.jpg`,
        `${CONFIG.imageFolder}/${serial}-2.jpg`
      ];
    }

    function toBengaliNumber(num) {
      const bnDigits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
      return String(num).replace(/\d/g, (d) => bnDigits[Number(d)]);
    }

    function setButtonSelectedState(btn, isSelected) {
      if (!btn) return;
      btn.classList.toggle("is-selected", isSelected);
      if (isSelected) {
        btn.innerHTML = `<span class="red-tick">✔</span> পছন্দ করা হয়েছে`;
      } else {
        btn.textContent = "পছন্দ করুন";
      }
    }

    // ==========================================
    // ৪. রেন্ডারিং ফাংশনসমূহ
    // ==========================================
    function renderCategories() {
      const grid = document.getElementById("categoryGrid");
      grid.innerHTML = "";
      CATEGORIES.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-card" + (currentCategory === cat.id ? " active" : "");
        btn.onclick = () => selectCategory(cat.id);

        const img = document.createElement("img");
        img.src = cat.image;
        img.alt = cat.name;
        img.loading = "lazy";
        img.onerror = function () {
          this.style.display = "none";
        };

        const label = document.createElement("div");
        label.className = "cat-label";
        label.textContent = cat.name;

        btn.appendChild(img);
        btn.appendChild(label);
        grid.appendChild(btn);
      });
    }

    function selectCategory(catId) {
      currentCategory = catId;
      const filters = getActivePriceFilters();
      currentPriceFilter = filters[0];
      currentTypeFilter = "all";

      const catObj = CATEGORIES.find((c) => c.id === catId);
      document.getElementById("backBtn").style.display = "inline-block";
      document.getElementById("statusInfo").textContent = catObj ? catObj.name : "";
      document.getElementById("priceSection").style.display = "block";
      document.getElementById("productSection").style.display = "block";

      renderCategories();
      renderPriceChips();
      renderTypeChipsAndProducts();
    }

    function renderPriceChips() {
      const container = document.getElementById("priceChips");
      container.innerHTML = "";
      const filters = getActivePriceFilters();
      filters.forEach((pf) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "filter-chip" + (currentPriceFilter.id === pf.id ? " active" : "");
        chip.textContent = pf.label;
        chip.onclick = () => {
          currentPriceFilter = pf;
          currentTypeFilter = "all";
          renderPriceChips();
          renderTypeChipsAndProducts();
        };
        container.appendChild(chip);
      });
    }

    function getProductsInCategoryAndPrice() {
      return allProducts.filter(
        (p) => p.category === currentCategory && Number(p.price) <= currentPriceFilter.max
      );
    }

    function renderTypeChipsAndProducts() {
      const baseList = getProductsInCategoryAndPrice();
      const types = ["all", ...new Set(baseList.map((p) => p.type).filter(Boolean))];

      if (!types.includes(currentTypeFilter)) {
        currentTypeFilter = "all";
      }

      const typeContainer = document.getElementById("typeChips");
      typeContainer.innerHTML = "";
      types.forEach((t) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "filter-chip" + (currentTypeFilter === t ? " active" : "");
        chip.textContent = t === "all" ? "সব ধরন" : t;
        chip.onclick = () => {
          currentTypeFilter = t;
          renderTypeChipsAndProducts();
        };
        typeContainer.appendChild(chip);
      });

      const finalList =
        currentTypeFilter === "all"
          ? baseList
          : baseList.filter((p) => p.type === currentTypeFilter);

      renderProducts(finalList);
    }

    function renderProducts(list) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      if (!list.length) {
        grid.innerHTML = `<div class="empty-box" style="grid-column: 1 / -1;">এই ভাগে আপাতত কোনো প্রোডাক্ট নেই।</div>`;
        return;
      }

      list.forEach((prod) => {
        const isSelected = selectedMap.has(prod.serial);
        const imgs = getProductImages(prod.serial);

        const card = document.createElement("article");
        card.className = "product-card";

        const imgWrap = document.createElement("div");
        imgWrap.className = "img-single-wrap";
        imgWrap.onclick = () => openLightbox(prod, 0);

        const mainImg = document.createElement("img");
        mainImg.src = imgs[0];
        mainImg.alt = `${prod.type} (${prod.serial})`;
        mainImg.loading = "lazy";

        const badge = document.createElement("span");
        badge.className = "two-photo-badge";
        badge.textContent = "২টি ছবি আছে";

        imgWrap.appendChild(mainImg);
        imgWrap.appendChild(badge);

        // পুরো সাদা অংশ জুড়ে ক্লিক করলে সিলেক্ট হবে
        const body = document.createElement("div");
        body.className = "prod-body";
        body.onclick = (e) => {
          if (e.target.closest(".select-btn")) return;
          toggleSelect(prod.serial);
        };

        const codeRow = document.createElement("div");
        codeRow.className = "prod-code-row";
        codeRow.innerHTML = `<span>কোড</span><span>${escapeHtml(prod.serial)}</span>`;

        const priceEl = document.createElement("div");
        priceEl.className = "prod-price-center";
        priceEl.textContent = `₹${toBengaliNumber(prod.price)}`;

        const typeEl = document.createElement("div");
        typeEl.className = "prod-type";
        typeEl.textContent = prod.type || "কালেকশন";

        const selBtn = document.createElement("button");
        selBtn.type = "button";
        selBtn.className = "select-btn";
        setButtonSelectedState(selBtn, isSelected);
        selBtn.onclick = (e) => {
          e.stopPropagation();
          toggleSelect(prod.serial);
        };

        body.appendChild(codeRow);
        body.appendChild(priceEl);
        body.appendChild(typeEl);
        body.appendChild(selBtn);

        card.appendChild(imgWrap);
        card.appendChild(body);
        grid.appendChild(card);
      });
    }

    function goBackStep() {
      currentCategory = null;
      document.getElementById("backBtn").style.display = "none";
      document.getElementById("statusInfo").textContent = "ক্যাটাগরি বেছে নিন";
      document.getElementById("priceSection").style.display = "none";
      document.getElementById("productSection").style.display = "none";
      renderCategories();
    }

    // ==========================================
    // ৫. পছন্দ করা, সাউন্ড ও নিচের ফিক্সড বার আপডেট
    // ==========================================
    function toggleSelect(serial) {
      const prod = allProducts.find((p) => p.serial === serial);
      if (!prod) return;

      if (selectedMap.has(serial)) {
        selectedMap.delete(serial);
        syncSelectButtonsUI();
        updateStickyCartBar(false);
      } else {
        selectedMap.set(serial, prod);
        armExitGuard();
        playTingSound();
        syncSelectButtonsUI();
        updateStickyCartBar(true);
      }
    }

    function syncSelectButtonsUI() {
      const cards = document.querySelectorAll(".product-card");
      const currentList =
        currentTypeFilter === "all"
          ? getProductsInCategoryAndPrice()
          : getProductsInCategoryAndPrice().filter((p) => p.type === currentTypeFilter);

      cards.forEach((card, idx) => {
        const prod = currentList[idx];
        if (!prod) return;
        const btn = card.querySelector(".select-btn");
        setButtonSelectedState(btn, selectedMap.has(prod.serial));
      });

      if (lbProduct) {
        const lbBtn = document.getElementById("lbSelectBtn");
        setButtonSelectedState(lbBtn, selectedMap.has(lbProduct.serial));
      }
    }

    function updateStickyCartBar(wasAdded) {
      const bar = document.getElementById("stickyCartBar");
      const count = selectedMap.size;

      if (count <= 0) {
        bar.classList.remove("visible");
        return;
      }

      bar.classList.add("visible");
      document.getElementById("liveCountBadge").textContent = toBengaliNumber(count);
      document.getElementById("liveCountText").textContent =
        `${toBengaliNumber(count)}টি পছন্দ হয়েছে, আরও বেছে নিতে পারেন`;

      if (wasAdded && !hasPlayedFirstWaAnimation) {
        hasPlayedFirstWaAnimation = true;
        const waBtn = document.getElementById("waOrderBtn");
        waBtn.classList.remove("first-pop-shake");
        void waBtn.offsetWidth;
        waBtn.classList.add("first-pop-shake");
        setTimeout(() => {
          playFirstWaNoticeSound();
        }, 120);
      }
    }

    // ==========================================
    // ৬. বড় করে দেখার ভিউ (Lightbox)
    // ==========================================
    function openLightbox(prod, startIdx = 0) {
      lbProduct = prod;
      lbSlideIndex = startIdx;

      document.getElementById("lbSerial").textContent = `কোড: ${prod.serial}`;
      document.getElementById("lbTitle").textContent = prod.type || "কালেকশন";
      document.getElementById("lbPrice").textContent = `₹${toBengaliNumber(prod.price)}`;

      const lbBtn = document.getElementById("lbSelectBtn");
      lbBtn.onclick = () => toggleSelect(prod.serial);

      updateLightboxSlide();
      syncSelectButtonsUI();

      document.getElementById("lightbox").classList.add("open");
      lbOpenedFromHistory = true;
      history.pushState({ modal: "lightbox" }, "");
    }

    function updateLightboxSlide() {
      if (!lbProduct) return;
      const imgs = getProductImages(lbProduct.serial);
      const imgEl = document.getElementById("lbImg");
      imgEl.src = imgs[lbSlideIndex] || imgs[0];

      document.getElementById("lbSlideCounter").textContent =
        `${toBengaliNumber(lbSlideIndex + 1)} / ${toBengaliNumber(imgs.length)}`;

      const dotsWrap = document.getElementById("lbDots");
      dotsWrap.innerHTML = "";
      imgs.forEach((_, i) => {
        const d = document.createElement("span");
        d.className = "lb-dot" + (i === lbSlideIndex ? " active" : "");
        dotsWrap.appendChild(d);
      });
    }

    function changeLbSlide(step) {
      if (!lbProduct) return;
      const total = getProductImages(lbProduct.serial).length;
      lbSlideIndex = (lbSlideIndex + step + total) % total;
      updateLightboxSlide();
    }

    function closeLightbox(fromButton = false) {
      const lb = document.getElementById("lightbox");
      if (!lb.classList.contains("open")) return;
      lb.classList.remove("open");
      lbProduct = null;

      if (fromButton && lbOpenedFromHistory) {
        lbOpenedFromHistory = false;
        ignoreNextPopstate = true;
        history.back();
      }
    }

    let touchStartX = 0;
    document.getElementById("lbStage").addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.getElementById("lbStage").addEventListener("touchend", (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 40) {
        changeLbSlide(diff < 0 ? 1 : -1);
      }
    }, { passive: true });

    // ==========================================
    // ৭. WhatsApp অর্ডার পাঠানো
    // ==========================================
    function sendOrderToWhatsApp() {
      if (selectedMap.size === 0) return;

      const lines = ["নমস্কার, আমি নিচের প্রোডাক্টগুলো পছন্দ করেছি:"];
      let total = 0;
      let i = 1;

      selectedMap.forEach((p) => {
        const amt = Number(p.price) || 0;
        total += amt;
        lines.push(`${toBengaliNumber(i)}. কোড: ${p.serial} | ${p.type} | ₹${toBengaliNumber(amt)}`);
        i++;
      });

      lines.push(`মোট আনুমানিক মূল্য: ₹${toBengaliNumber(total)}`);
      const message = encodeURIComponent(lines.join("\n"));
      const cleanPhone = CONFIG.whatsappNumber.replace(/\D/g, "");
      const url = `https://wa.me/${cleanPhone}?text=${message}`;

      window.open(url, "_blank", "noopener,noreferrer");
    }

    // ==========================================
    // ৮. এক্সিট গার্ড পপ-আপ
    // ==========================================
    function armExitGuard() {
      if (!exitPromptArmed) {
        exitPromptArmed = true;
        history.pushState({ guard: "active" }, "");
      }
    }

    window.addEventListener("popstate", () => {
      if (ignoreNextPopstate) {
        ignoreNextPopstate = false;
        return;
      }

      const lb = document.getElementById("lightbox");
      if (lb.classList.contains("open")) {
        lbOpenedFromHistory = false;
        closeLightbox(false);
        return;
      }

      if (selectedMap.size > 0) {
        document.getElementById("exitModal").classList.add("open");
        history.pushState({ guard: "active" }, "");
      }
    });

    function stayOnSite() {
      document.getElementById("exitModal").classList.remove("open");
    }

    function confirmLeaveSite() {
      selectedMap.clear();
      exitPromptArmed = false;
      document.getElementById("exitModal").classList.remove("open");
      updateStickyCartBar(false);
      history.go(-2);
    }

    // ==========================================
    // ৯. Google Sheet CSV লোডার
    // ==========================================
    async function loadFromGoogleSheetIfConfigured() {
      if (!CONFIG.googleSheetCsvUrl) return;
      try {
        const res = await fetch(CONFIG.googleSheetCsvUrl);
        if (!res.ok) return;
        const text = await res.text();
        const rows = text.trim().split(/\r?\n/).slice(1);
        const parsed = rows
          .map((line) => line.split(",").map((c) => c.trim().replace(/^"|"$/g, "")))
          .filter((cols) => cols[0] && cols[1] && cols[3])
          .map((cols) => ({
            serial: cols[0],
            category: cols[1].toLowerCase(),
            type: cols[2] || "কালেকশন",
            price: Number(cols[3]) || 0
          }));

        if (parsed.length > 0) {
          allProducts = parsed;
          if (currentCategory) {
            renderTypeChipsAndProducts();
          }
        }
      } catch (err) {}
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    // শুরুতে রেন্ডার
    renderCategories();
    loadFromGoogleSheetIfConfigured();
  </script>
