<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>বন্দনা শাড়ি — কালেকশন ক্যাটালগ</title>
  <style>
    :root {
      --bg-page: #faf7f5;
      --bg-card: #ffffff;
      --ink-main: #23191e;
      --ink-muted: #695860;
      --maroon: #800020;
      --maroon-dark: #5c0017;
      --selected-bg: #d97706;
      --selected-ink: #ffffff;
      --border-soft: #eadce0;
      --accent-soft: #fdf2f4;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      color: var(--ink-main);
      padding-bottom: 96px;
      line-height: 1.45;
    }

    /* ওয়েলকাম ব্যানার */
    .hero-banner {
      width: 100%;
      background: linear-gradient(135deg, var(--maroon), var(--maroon-dark));
      position: relative;
      overflow: hidden;
    }

    .hero-banner img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
    }

    .banner-fallback {
      padding: 22px 16px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, var(--maroon), var(--maroon-dark));
    }

    .banner-fallback h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      letter-spacing: 0.5px;
    }

    .banner-fallback p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.92;
    }

    /* মূল কন্টেইনার */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
    }

    /* টপ নেভিগেশন / ব্রেডক্রাম্ব */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      min-height: 36px;
    }

    .back-nav-btn {
      background: #fff;
      border: 1px solid var(--border-soft);
      color: var(--maroon);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .status-info {
      font-size: 0.85rem;
      color: var(--ink-muted);
      font-weight: 600;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 12px 0 8px;
      color: var(--ink-main);
    }

    /* ৩টি ছোট ক্যাটাগরি কার্ড (ভবিষ্যতে আরও যোগ করার উপযোগী গ্রিড) */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cat-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 2px 6px rgba(128, 0, 32, 0.06);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .cat-card:active {
      transform: scale(0.98);
    }

    .cat-card.active {
      border-color: var(--maroon);
      background: var(--accent-soft);
    }

    .cat-card img {
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      display: block;
    }

    .cat-label {
      padding: 7px 4px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink-main);
    }

    /* দামের ভাগ ও ভেতরের ধরন ফিল্টার চিপস */
    .filter-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0;
    }

    .filter-chip {
      background: #fff;
      border: 1px solid #d5c2c8;
      color: var(--ink-main);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--maroon);
      color: #fff;
      border-color: var(--maroon);
    }

    /* মোবাইলে এক লাইনে ২টি করে প্রোডাক্ট কার্ড */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .img-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      background: #f3ecee;
      cursor: pointer;
    }

    .img-pair img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
    }

    .prod-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prod-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--ink-muted);
      font-weight: 700;
    }

    .prod-type {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink-main);
    }

    .prod-price {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--maroon);
    }

    .select-btn {
      margin-top: 4px;
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 9px 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--maroon);
      color: #ffffff;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .select-btn:active {
      transform: scale(0.98);
    }

    .select-btn.is-selected {
      background-color: var(--selected-bg);
      color: var(--selected-ink);
    }

    /* বড় করে দেখার ভিউ (Lightbox / Modal) */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(18, 12, 15, 0.94);
      z-index: 900;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      color: #fff;
    }

    .lightbox.open {
      display: flex;
    }

    .lb-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lb-back-btn {
      background: #ffffff;
      color: var(--maroon-dark);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .lb-stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      overflow: hidden;
    }

    .lb-stage img {
      max-width: 100%;
      max-height: 62vh;
      border-radius: 10px;
      object-fit: contain;
      background: #000;
    }

    .lb-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.88);
      color: #111;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .lb-nav-btn.prev { left: 6px; }
    .lb-nav-btn.next { right: 6px; }

    .lb-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .lb-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }

    .lb-dot.active {
      background: #fbbf24;
    }

    .lb-footer {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
    }

    .lb-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
    }

    /* নিচের ফিক্সড বার (ইমেজ-বাটন ও লাইভ কাউন্ট) */
    .sticky-cart-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top: 2px solid var(--border-soft);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.12);
      padding: 8px 10px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 800;
    }

    .sticky-cart-bar.visible {
      display: flex;
    }

    .cart-note-box {
      position: relative;
      flex: 1.25;
      min-width: 0;
      height: 54px;
      border-radius: 8px;
      overflow: hidden;
      background: #fff6e5;
      border: 1px solid #f3c677;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    .cart-note-box img.note-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .cart-note-overlay {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .live-count-badge {
      background: var(--maroon);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      min-width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    .cart-note-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink-main);
      background: rgba(255, 255, 255, 0.85);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .wa-img-btn {
      flex: 0.9;
      max-width: 155px;
      height: 54px;
      padding: 0;
      border: none;
      background: #25d366;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wa-img-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .wa-fallback-label {
      position: absolute;
      color: #fff;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 0 6px;
      text-align: center;
      pointer-events: none;
    }

    /* এক্সিট কনফার্মেশন পপ-আপ (মোবাইলের বড় অংশ জুড়ে) */
    .exit-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .exit-modal.open {
      display: flex;
    }

    .exit-card {
      width: 100%;
      max-width: 420px;
      min-height: 52vh;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }

    .exit-msg {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--ink-main);
      margin: auto 0;
      line-height: 1.5;
    }

    .exit-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-stay {
      background: var(--maroon);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-leave {
      background: #f1e6e9;
      color: var(--ink-main);
      border: 1px solid #d8c2c8;
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-box {
      background: #fff;
      border: 1px dashed var(--border-soft);
      border-radius: 12px;
      padding: 24px 14px;
      text-align: center;
      color: var(--ink-muted);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- ওয়েলকাম ব্যানার -->
  <header class="hero-banner">
    <img src="images/banner.jpg" alt="বন্দনা শাড়ি" onload="this.nextElementSibling.style.display='none'" onerror="this.style.display='none'" />
    <div class="banner-fallback">
      <h1>বন্দনা শাড়ি</h1>
      <p>পছন্দের শাড়ি, কুর্তি ও ব্লাউজ বেছে সরাসরি WhatsApp-এ অর্ডার করুন</p>
    </div>
  </header>

  <main class="container">
    <div class="top-bar">
      <button id="backBtn" class="back-nav-btn" style="display:none;" onclick="goBackStep()">← আগের ধাপ</button>
      <span id="statusInfo" class="status-info">ক্যাটাগরি বেছে নিন</span>
    </div>

    <!-- ক্যাটাগরি গ্রিড (ভবিষ্যতে CATEGORIES অ্যারেতে নতুন ক্যাটাগরি যোগ করা যাবে) -->
    <section id="categorySection">
      <div class="section-title">ক্যাটাগরি</div>
      <div id="categoryGrid" class="category-grid"></div>
    </section>

    <!-- দামের ভাগ -->
    <section id="priceSection" style="display:none;">
      <div class="section-title" id="priceHeading">দামের ভাগ</div>
      <div id="priceChips" class="filter-strip"></div>
    </section>

    <!-- ভেতরের ধরন / সাব-ক্যাটাগরি ও প্রোডাক্ট তালিকা -->
    <section id="productSection" style="display:none;">
      <div class="section-title" id="typeHeading">ধরন অনুযায়ী দেখুন</div>
      <div id="typeChips" class="filter-strip"></div>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <!-- বড় করে দেখার ভিউ (Lightbox) -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
    <div class="lb-top">
      <button class="lb-back-btn" onclick="closeLightbox(true)">← ফিরে যান</button>
      <span id="lbSerial" style="font-weight:700;"></span>
    </div>

    <div class="lb-stage" id="lbStage">
      <button class="lb-nav-btn prev" onclick="changeLbSlide(-1)" aria-label="আগের ছবি">‹</button>
      <img id="lbImg" src="" alt="প্রোডাক্টের বড় ছবি" />
      <button class="lb-nav-btn next" onclick="changeLbSlide(1)" aria-label="পরের ছবি">›</button>
    </div>

    <div>
      <div class="lb-dots" id="lbDots"></div>
      <div class="lb-footer">
        <div class="lb-info-row">
          <span id="lbTitle"></span>
          <span id="lbPrice" style="color:#fbbf24;"></span>
        </div>
        <button id="lbSelectBtn" class="select-btn"></button>
      </div>
    </div>
  </div>

  <!-- নিচের ফিক্সড বার -->
  <div id="stickyCartBar" class="sticky-cart-bar">
    <div class="cart-note-box">
      <img class="note-bg" src="images/cart-note.jpg" alt="" onerror="this.style.display='none'" />
      <div class="cart-note-overlay">
        <span id="liveCountBadge" class="live-count-badge">০</span>
        <span id="liveCountText" class="cart-note-text">পছন্দ হয়েছে, আরও বেছে নিতে পারেন</span>
      </div>
    </div>

    <button class="wa-img-btn" onclick="sendOrderToWhatsApp()" aria-label="WhatsApp-এ অর্ডার প্লেস করুন">
      <img src="images/wa-btn.jpg" alt="WhatsApp-এ অর্ডার প্লেস করুন" onload="this.nextElementSibling.style.display='none'" onerror="this.style.display='none'" />
      <span class="wa-fallback-label">WhatsApp-এ অর্ডার</span>
    </button>
  </div>

  <!-- এক্সিট কনফার্মেশন পপ-আপ -->
  <div id="exitModal" class="exit-modal" role="dialog" aria-modal="true">
    <div class="exit-card">
      <div class="exit-msg">
        আপনি যদি এখন বেরিয়ে যান, তবে সিলেক্ট করা প্রোডাক্টগুলো বাতিল হয়ে যাবে।
      </div>
      <div class="exit-actions">
        <button class="btn-stay" onclick="stayOnSite()">থেকে যাবো</button>
        <button class="btn-leave" onclick="confirmLeaveSite()">বেরিয়ে যাবো</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ১. কনফিগারেশন (এখান থেকেই নম্বর ও শিট সেট করবেন)
    // ==========================================
    const CONFIG = {
      whatsappNumber: "919398452384", // আপনার দেওয়া নম্বর 9398452384 (দেশ কোডসহ)
      imageFolder: "images",
      // পাবলিশ করা Google Sheet-এর CSV লিংক থাকলে নিচে বসান (ফাঁকা রাখলে নিচের ডেমো ডেটা চলবে)
      googleSheetCsvUrl: ""
    };

    // ভবিষ্যতে নতুন ক্যাটাগরি যোগ করতে চাইলে এখানে শুধু আরেকটি অবজেক্ট যোগ করুন
    const CATEGORIES = [
      { id: "saree", name: "শাড়ি", image: "images/cat-saree.jpg" },
      { id: "kurti", name: "কুর্তি", image: "images/cat-kurti.jpg" },
      { id: "blouse", name: "ব্লাউজ", image: "images/cat-blouse.jpg" }
    ];

    const PRICE_FILTERS = [
      { id: "all", label: "সব দাম", max: Infinity },
      { id: "under-500", label: "Under 500", max: 500 },
      { id: "under-600", label: "Under 600", max: 600 },
      { id: "under-700", label: "Under 700", max: 700 },
      { id: "under-1000", label: "Under 1000", max: 1000 }
    ];

    // নমুনা প্রোডাক্ট তালিকা (Google Sheet যুক্ত করলে সেখান থেকে ডেটা আসবে)
    const SAMPLE_PRODUCTS = [
      { serial: "0001", category: "saree", type: "জামদানি", price: 450 },
      { serial: "0002", category: "saree", type: "বেনারসি", price: 680 },
      { serial: "0003", category: "saree", type: "জামদানি", price: 550 },
      { serial: "0004", category: "saree", type: "তাঁত", price: 890 },
      { serial: "0005", category: "kurti", type: "কটন কুর্তি", price: 390 },
      { serial: "0006", category: "kurti", type: "রেয়ন কুর্তি", price: 590 },
      { serial: "0007", category: "blouse", type: "কটন ব্লাউজ", price: 280 },
      { serial: "0008", category: "blouse", type: "ডিজাইনার ব্লাউজ", price: 490 }
    ];

    // ==========================================
    // ২. সেশন স্টেট (রিলোড করলে কার্ট রিসেট হবে)
    // ==========================================
    let allProducts = [...SAMPLE_PRODUCTS];
    let currentCategory = null;
    let currentPriceFilter = PRICE_FILTERS[0];
    let currentTypeFilter = "all";
    const selectedMap = new Map(); // serial -> product object

    // Lightbox স্টেট
    let lbProduct = null;
    let lbSlideIndex = 0;
    let lbOpenedFromHistory = false;
    let exitPromptArmed = false;

    function getProductImages(serial) {
      return [
        `${CONFIG.imageFolder}/${serial}-1.jpg`,
        `${CONFIG.imageFolder}/${serial}-2.jpg`
      ];
    }

    function toBengaliNumber(num) {
      const bnDigits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
      return String(num).replace(/\d/g, (d) => bnDigits[Number(d)]);
    }

    // ==========================================
    // ৩. রেন্ডারিং ফাংশনসমূহ
    // ==========================================
    function renderCategories() {
      const grid = document.getElementById("categoryGrid");
      grid.innerHTML = "";
      CATEGORIES.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-card" + (currentCategory === cat.id ? " active" : "");
        btn.onclick = () => selectCategory(cat.id);

        const img = document.createElement("img");
        img.src = cat.image;
        img.alt = cat.name;
        img.loading = "lazy";
        img.onerror = function () {
          this.style.display = "none";
        };

        const label = document.createElement("div");
        label.className = "cat-label";
        label.textContent = cat.name;

        btn.appendChild(img);
        btn.appendChild(label);
        grid.appendChild(btn);
      });
    }

    function selectCategory(catId) {
      currentCategory = catId;
      currentPriceFilter = PRICE_FILTERS[0];
      currentTypeFilter = "all";

      const catObj = CATEGORIES.find((c) => c.id === catId);
      document.getElementById("backBtn").style.display = "inline-block";
      document.getElementById("statusInfo").textContent = catObj ? catObj.name : "";
      document.getElementById("priceSection").style.display = "block";
      document.getElementById("productSection").style.display = "block";

      renderCategories();
      renderPriceChips();
      renderTypeChipsAndProducts();
    }

    function renderPriceChips() {
      const container = document.getElementById("priceChips");
      container.innerHTML = "";
      PRICE_FILTERS.forEach((pf) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "filter-chip" + (currentPriceFilter.id === pf.id ? " active" : "");
        chip.textContent = pf.label;
        chip.onclick = () => {
          currentPriceFilter = pf;
          currentTypeFilter = "all";
          renderPriceChips();
          renderTypeChipsAndProducts();
        };
        container.appendChild(chip);
      });
    }

    function getProductsInCategoryAndPrice() {
      return allProducts.filter(
        (p) => p.category === currentCategory && Number(p.price) <= currentPriceFilter.max
      );
    }

    function renderTypeChipsAndProducts() {
      const baseList = getProductsInCategoryAndPrice();
      const types = ["all", ...new Set(baseList.map((p) => p.type).filter(Boolean))];

      if (!types.includes(currentTypeFilter)) {
        currentTypeFilter = "all";
      }

      const typeContainer = document.getElementById("typeChips");
      typeContainer.innerHTML = "";
      types.forEach((t) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "filter-chip" + (currentTypeFilter === t ? " active" : "");
        chip.textContent = t === "all" ? "সব ধরন" : t;
        chip.onclick = () => {
          currentTypeFilter = t;
          renderTypeChipsAndProducts();
        };
        typeContainer.appendChild(chip);
      });

      const finalList =
        currentTypeFilter === "all"
          ? baseList
          : baseList.filter((p) => p.type === currentTypeFilter);

      renderProducts(finalList);
    }

    function renderProducts(list) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      if (!list.length) {
        grid.innerHTML = `<div class="empty-box" style="grid-column: 1 / -1;">এই ভাগে আপাতত কোনো প্রোডাক্ট নেই।</div>`;
        return;
      }

      list.forEach((prod) => {
        const isSelected = selectedMap.has(prod.serial);
        const imgs = getProductImages(prod.serial);

        const card = document.createElement("article");
        card.className = "product-card";

        const pairDiv = document.createElement("div");
        pairDiv.className = "img-pair";
        pairDiv.onclick = () => openLightbox(prod, 0);

        imgs.forEach((src, idx) => {
          const im = document.createElement("img");
          im.src = src;
          im.alt = `${prod.serial} ছবি ${idx + 1}`;
          im.loading = "lazy";
          pairDiv.appendChild(im);
        });

        const body = document.createElement("div");
        body.className = "prod-body";

        const meta = document.createElement("div");
        meta.className = "prod-meta";
        meta.innerHTML = `<span>কোড: ${escapeHtml(prod.serial)}</span><span>২টি ছবি</span>`;

        const typeEl = document.createElement("div");
        typeEl.className = "prod-type";
        typeEl.textContent = prod.type || "কালেকশন";

        const priceEl = document.createElement("div");
        priceEl.className = "prod-price";
        priceEl.textContent = `₹${toBengaliNumber(prod.price)}`;

        const selBtn = document.createElement("button");
        selBtn.type = "button";
        selBtn.className = "select-btn" + (isSelected ? " is-selected" : "");
        selBtn.textContent = isSelected ? "✓ পছন্দ করা হয়েছে" : "পছন্দ করুন";
        selBtn.onclick = () => toggleSelect(prod.serial);

        body.appendChild(meta);
        body.appendChild(typeEl);
        body.appendChild(priceEl);
        body.appendChild(selBtn);

        card.appendChild(pairDiv);
        card.appendChild(body);
        grid.appendChild(card);
      });
    }

    function goBackStep() {
      currentCategory = null;
      document.getElementById("backBtn").style.display = "none";
      document.getElementById("statusInfo").textContent = "ক্যাটাগরি বেছে নিন";
      document.getElementById("priceSection").style.display = "none";
      document.getElementById("productSection").style.display = "none";
      renderCategories();
    }

    // ==========================================
    // ৪. পছন্দ করা ও নিচের ফিক্সড বার আপডেট
    // ==========================================
    function toggleSelect(serial) {
      const prod = allProducts.find((p) => p.serial === serial);
      if (!prod) return;

      if (selectedMap.has(serial)) {
        selectedMap.delete(serial);
      } else {
        selectedMap.set(serial, prod);
        armExitGuard();
      }

      syncSelectButtonsUI();
      updateStickyCartBar();
    }

    function syncSelectButtonsUI() {
      const buttons = document.querySelectorAll(".select-btn[data-serial], .product-card");
      // প্রোডাক্ট কার্ডের বাটন আপডেট
      const cards = document.querySelectorAll(".product-card");
      const currentList =
        currentTypeFilter === "all"
          ? getProductsInCategoryAndPrice()
          : getProductsInCategoryAndPrice().filter((p) => p.type === currentTypeFilter);

      cards.forEach((card, idx) => {
        const prod = currentList[idx];
        if (!prod) return;
        const btn = card.querySelector(".select-btn");
        const active = selectedMap.has(prod.serial);
        btn.classList.toggle("is-selected", active);
        btn.textContent = active ? "✓ পছন্দ করা হয়েছে" : "পছন্দ করুন";
      });

      // Lightbox-এর বাটন আপডেট
      if (lbProduct) {
        const lbBtn = document.getElementById("lbSelectBtn");
        const active = selectedMap.has(lbProduct.serial);
        lbBtn.classList.toggle("is-selected", active);
        lbBtn.textContent = active ? "✓ পছন্দ করা হয়েছে" : "পছন্দ করুন";
      }
    }

    function updateStickyCartBar() {
      const bar = document.getElementById("stickyCartBar");
      const count = selectedMap.size;

      if (count <= 0) {
        bar.classList.remove("visible");
        return;
      }

      bar.classList.add("visible");
      document.getElementById("liveCountBadge").textContent = toBengaliNumber(count);
      document.getElementById("liveCountText").textContent =
        `${toBengaliNumber(count)}টি পছন্দ হয়েছে, আরও বেছে নিতে পারেন`;
    }

    // ==========================================
    // ৫. বড় করে দেখার ভিউ (Lightbox + মোবাইল ব্যাক)
    // ==========================================
    function openLightbox(prod, startIdx = 0) {
      lbProduct = prod;
      lbSlideIndex = startIdx;

      document.getElementById("lbSerial").textContent = `কোড: ${prod.serial}`;
      document.getElementById("lbTitle").textContent = prod.type || "কালেকশন";
      document.getElementById("lbPrice").textContent = `₹${toBengaliNumber(prod.price)}`;

      const lbBtn = document.getElementById("lbSelectBtn");
      lbBtn.onclick = () => toggleSelect(prod.serial);

      updateLightboxSlide();
      syncSelectButtonsUI();

      document.getElementById("lightbox").classList.add("open");
      lbOpenedFromHistory = true;
      history.pushState({ modal: "lightbox" }, "");
    }

    function updateLightboxSlide() {
      if (!lbProduct) return;
      const imgs = getProductImages(lbProduct.serial);
      const imgEl = document.getElementById("lbImg");
      imgEl.src = imgs[lbSlideIndex] || imgs[0];

      const dotsWrap = document.getElementById("lbDots");
      dotsWrap.innerHTML = "";
      imgs.forEach((_, i) => {
        const d = document.createElement("span");
        d.className = "lb-dot" + (i === lbSlideIndex ? " active" : "");
        dotsWrap.appendChild(d);
      });
    }

    function changeLbSlide(step) {
      if (!lbProduct) return;
      const total = getProductImages(lbProduct.serial).length;
      lbSlideIndex = (lbSlideIndex + step + total) % total;
      updateLightboxSlide();
    }

    function closeLightbox(fromButton = false) {
      const lb = document.getElementById("lightbox");
      if (!lb.classList.contains("open")) return;
      lb.classList.remove("open");
      lbProduct = null;

      if (fromButton && lbOpenedFromHistory) {
        lbOpenedFromHistory = false;
        history.back();
      }
    }

    // Lightbox-এ সোয়াইপ সাপোর্ট
    let touchStartX = 0;
    document.getElementById("lbStage").addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.getElementById("lbStage").addEventListener("touchend", (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 40) {
        changeLbSlide(diff < 0 ? 1 : -1);
      }
    }, { passive: true });

    // ==========================================
    // ৬. WhatsApp অর্ডার পাঠানো
    // ==========================================
    function sendOrderToWhatsApp() {
      if (selectedMap.size === 0) return;

      const lines = ["নমস্কার, আমি নিচের প্রোডাক্টগুলো পছন্দ করেছি:"];
      let total = 0;
      let i = 1;

      selectedMap.forEach((p) => {
        const amt = Number(p.price) || 0;
        total += amt;
        lines.push(`${toBengaliNumber(i)}. কোড: ${p.serial} | ${p.type} | ₹${toBengaliNumber(amt)}`);
        i++;
      });

      lines.push(`মোট আনুমানিক মূল্য: ₹${toBengaliNumber(total)}`);
      const message = encodeURIComponent(lines.join("\n"));
      const cleanPhone = CONFIG.whatsappNumber.replace(/\D/g, "");
      const url = `https://wa.me/${cleanPhone}?text=${message}`;

      window.open(url, "_blank", "noopener,noreferrer");
    }

    // ==========================================
    // ৭. এক্সিট গার্ড পপ-আপ
    // ==========================================
    function armExitGuard() {
      if (!exitPromptArmed) {
        exitPromptArmed = true;
        history.pushState({ guard: "active" }, "");
      }
    }

    window.addEventListener("popstate", () => {
      const lb = document.getElementById("lightbox");
      if (lb.classList.contains("open")) {
        lbOpenedFromHistory = false;
        closeLightbox(false);
        return;
      }

      if (selectedMap.size > 0) {
        document.getElementById("exitModal").classList.add("open");
        history.pushState({ guard: "active" }, "");
      }
    });

    function stayOnSite() {
      document.getElementById("exitModal").classList.remove("open");
    }

    function confirmLeaveSite() {
      selectedMap.clear();
      exitPromptArmed = false;
      document.getElementById("exitModal").classList.remove("open");
      updateStickyCartBar();
      history.go(-2);
    }

    // ==========================================
    // ৮. Google Sheet CSV লোডার (ঐচ্ছিক)
    // ==========================================
    async function loadFromGoogleSheetIfConfigured() {
      if (!CONFIG.googleSheetCsvUrl) return;
      try {
        const res = await fetch(CONFIG.googleSheetCsvUrl);
        if (!res.ok) return;
        const text = await res.text();
        const rows = text.trim().split(/\r?\n/).slice(1);
        const parsed = rows
          .map((line) => line.split(",").map((c) => c.trim().replace(/^"|"$/g, "")))
          .filter((cols) => cols[0] && cols[1] && cols[3])
          .map((cols) => ({
            serial: cols[0],
            category: cols[1].toLowerCase(),
            type: cols[2] || "কালেকশন",
            price: Number(cols[3]) || 0
          }));

        if (parsed.length > 0) {
          allProducts = parsed;
          if (currentCategory) {
            renderTypeChipsAndProducts();
          }
        }
      } catch (err) {
        // নেটওয়ার্ক সমস্যা হলে নমুনা ডেটা দিয়েই সচল থাকবে
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    // শুরুতে রেন্ডার
    renderCategories();
    loadFromGoogleSheetIfConfigured();
  </script>
</body>
