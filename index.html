<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <!-- মোবাইলে সাধারণ মোডেও ডেস্কটপ-স্টাইল পরিপাটি লেআউট বজায় রাখার জন্য -->
  <meta name="viewport" content="width=960" />
  <title>বন্দনা শাড়ি — কালেকশন ক্যাটালগ</title>
  <style>
    :root {
      --bg-page: #faf7f5;
      --bg-card: #ffffff;
      --ink-main: #1f161a;
      --ink-muted: #65555c;
      --maroon: #800020;
      --maroon-dark: #590016;
      --emerald-premium: #0f6b4e;
      --selected-ink: #ffffff;
      --border-soft: #eadce0;
      --accent-soft: #fdf2f4;
      --img-frame-bg: #f6efe9;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-width: 960px;
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      color: var(--ink-main);
      padding-bottom: 110px;
      line-height: 1.4;
    }

    /* ওয়েলকাম ব্যানার: ক্রপ না হয়ে আনুপাতিকভাবে পুরোটা দেখাবে */
    .hero-banner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: linear-gradient(135deg, var(--maroon), var(--maroon-dark));
      position: relative;
      overflow: hidden;
    }

    .hero-banner img {
      width: 100%;
      height: auto;
      max-height: 720px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    /* মূল কন্টেইনার */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 20px;
    }

    /* টপ নেভিগেশন */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      min-height: 46px;
    }

    .back-nav-btn {
      background: #fff;
      border: 1.5px solid var(--border-soft);
      color: var(--maroon);
      font-weight: 800;
      font-size: 1.15rem;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .status-info {
      font-size: 1.4rem;
      color: var(--ink-main);
      font-weight: 900;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 900;
      margin: 14px 0 14px;
      color: var(--ink-main);
    }

    /* ১. শুরুতে এক সারিতে ৩টি পছন্দের বিভাগ (শাড়ি, ব্লাউজ, কুর্তি) */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    /* ২. যেকোনো একটি সিলেক্ট করলে: বাম পাশে ১টি বড় ও ডান পাশে ২টি ছোট উপর-নিচে */
    .category-grid.is-split {
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: repeat(2, minmax(170px, auto));
      gap: 16px;
      align-items: stretch;
    }

    .cat-card {
      background: var(--bg-card);
      border: 2px solid var(--border-soft);
      border-radius: 16px;
      overflow: hidden;
      text-align: center;
      cursor: pointer;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(128, 0, 32, 0.08);
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .cat-card:active {
      transform: scale(0.985);
    }

    /* ক্যাটাগরি ছবি: ক্রপ না হয়ে পুরো ছবি দেখাবে */
    .cat-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: var(--img-frame-bg);
      display: block;
    }

    .cat-label {
      padding: 12px 10px;
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--ink-main);
      background: #fff;
    }

    /* স্প্লিট মোডে সিলেক্ট করা বড় কার্ড (বাম পাশে পুরো উচ্চতা জুড়ে) */
    .category-grid.is-split .cat-card.active {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
      border-color: var(--maroon);
      background: var(--accent-soft);
      box-shadow: 0 6px 18px rgba(128, 0, 32, 0.16);
    }

    .category-grid.is-split .cat-card.active img {
      flex: 1;
      width: 100%;
      height: auto;
      max-height: 360px;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: var(--img-frame-bg);
    }

    .category-grid.is-split .cat-card.active .cat-label {
      background: var(--maroon);
      color: #ffffff;
      font-size: 1.85rem;
      padding: 14px 12px;
    }

    /* স্প্লিট মোডে ডান পাশের বাকি ২টি ছোট কার্ড (উপর-নিচে) */
    .category-grid.is-split .cat-card:not(.active) {
      grid-column: 2 / 3;
      flex-direction: row;
      align-items: center;
      text-align: left;
    }

    .category-grid.is-split .cat-card:not(.active) img {
      width: 190px;
      min-width: 190px;
      height: 100%;
      min-height: 155px;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: var(--img-frame-bg);
      flex-shrink: 0;
    }

    .category-grid.is-split .cat-card:not(.active) .cat-label {
      flex: 1;
      height: 100%;
      font-size: 1.55rem;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-grid.is-split .cat-card:not(.active) .cat-label::after {
      content: "›";
      font-size: 1.8rem;
      color: var(--maroon);
      font-weight: 900;
    }

    /* দামের ভাগ ও ভেতরের ধরন ফিল্টার চিপস */
    .filter-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0;
    }

    .filter-chip {
      background: #fff;
      border: 1.5px solid #d5c2c8;
      color: var(--ink-main);
      padding: 10px 18px;
      border-radius: 26px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
    }

    .filter-chip.active {
      background: var(--maroon);
      color: #fff;
      border-color: var(--maroon);
    }

    /* প্রোডাক্ট গ্রিড: এক লাইনে ২টি করে বড় প্রোডাক্ট কার্ড */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-top: 16px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-soft);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
    }

    /* প্রোডাক্টের ছবি বড় ও স্পষ্ট */
    .img-single-wrap {
      position: relative;
      width: 100%;
      background: #f3ecee;
      cursor: pointer;
    }

    .img-single-wrap img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
    }

    .two-photo-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(25, 16, 20, 0.82);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 12px;
    }

    /* সাদা কার্ডের লেখার অংশ: উপর-নিচ থেকে কমপ্রেস করে সরু ও পরিপাটি করা হয়েছে */
    .prod-body {
      padding: 7px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      background: var(--bg-card);
    }

    /* কোড এবং দাম একই লাইনে/লেভেলে */
    .prod-top-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      line-height: 1.15;
    }

    .prod-code-text {
      font-size: 1.05rem;
      color: var(--ink-muted);
      font-weight: 800;
      white-space: nowrap;
    }

    .prod-price-inline {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--maroon);
      line-height: 1.1;
      white-space: nowrap;
    }

    .prod-type {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--ink-main);
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .select-btn {
      margin-top: 2px;
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 1.12rem;
      font-weight: 800;
      cursor: pointer;
      background-color: var(--maroon);
      color: #ffffff;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1.2;
    }

    .select-btn.is-selected {
      background-color: var(--emerald-premium);
      color: var(--selected-ink);
    }

    .red-tick {
      color: #ff2a2a;
      font-weight: 900;
      font-size: 1.2rem;
      text-shadow: 0 0 2px rgba(255, 255, 255, 0.85);
    }

    /* বড় করে দেখার ভিউ (Lightbox / Modal) */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(15, 10, 13, 0.96);
      z-index: 900;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 24px;
      color: #fff;
    }

    .lightbox.open {
      display: flex;
    }

    .lb-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      color: #e5d8dc;
    }

    .lb-stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      overflow: hidden;
    }

    .lb-stage img {
      max-width: 100%;
      max-height: 60vh;
      border-radius: 10px;
      object-fit: contain;
      background: #000;
    }

    .lb-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.92);
      color: #111;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
    }

    .lb-nav-btn.prev { left: 16px; }
    .lb-nav-btn.next { right: 16px; }

    .lb-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .lb-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }

    .lb-dot.active {
      background: #fbbf24;
    }

    .lb-back-bottom-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .lb-back-btn {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      color: var(--maroon-dark);
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 900;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .lb-footer {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
    }

    .lb-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 1.3rem;
    }

    /* নিচের ফিক্সড বার: ৫০% / ৫০% ভাগ */
    .sticky-cart-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top: 2px solid var(--border-soft);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.14);
      padding: 8px 16px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 800;
    }

    .sticky-cart-bar.visible {
      display: flex;
    }

    .cart-note-box {
      position: relative;
      flex: 1;
      max-width: 540px;
      height: 64px;
      border-radius: 10px;
      overflow: hidden;
      background: #fff6e5;
      border: 1px solid #f3c677;
      display: flex;
      align-items: center;
      padding: 0 12px;
    }

    .cart-note-box img.note-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .cart-note-overlay {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .live-count-badge {
      background: var(--maroon);
      color: #fff;
      font-weight: 900;
      font-size: 1.15rem;
      min-width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      flex-shrink: 0;
    }

    .cart-note-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--ink-main);
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 10px;
      border-radius: 6px;
      line-height: 1.25;
    }

    .wa-img-btn {
      flex: 1;
      max-width: 540px;
      height: 64px;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 10px;
      overflow: visible;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wa-img-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .wa-fallback-label {
      position: absolute;
      inset: 0;
      background: #25d366;
      color: #fff;
      font-weight: 900;
      font-size: 1.15rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      text-align: center;
      pointer-events: none;
    }

    @keyframes waFirstAttention {
      0%   { transform: translateY(0) scale(1) rotate(0deg); }
      22%  { transform: translateY(-10px) scale(1.06) rotate(-2deg); }
      40%  { transform: translateY(-10px) scale(1.06) rotate(2.5deg); }
      58%  { transform: translateY(-9px) scale(1.05) rotate(-2deg); }
      76%  { transform: translateY(-6px) scale(1.03) rotate(1.5deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }

    .wa-img-btn.first-pop-shake {
      animation: waFirstAttention 0.75s ease-in-out;
    }

    /* এক্সিট কনফার্মেশন পপ-আপ */
    .exit-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.74);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .exit-modal.open {
      display: flex;
    }

    .exit-card {
      width: 100%;
      max-width: 460px;
      min-height: 44vh;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }

    .exit-msg {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--ink-main);
      margin: auto 0;
      line-height: 1.55;
    }

    .exit-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-stay {
      background: var(--maroon);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-leave {
      background: #f1e6e9;
      color: var(--ink-main);
      border: 1px solid #d8c2c8;
      border-radius: 12px;
      padding: 13px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-box {
      background: #fff;
      border: 1px dashed var(--border-soft);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 1.25rem;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- ওয়েলকাম ব্যানার -->
  <header class="hero-banner">
    <img src="images/banner.jpg" alt="বন্দনা শাড়ি ব্যানার" onerror="this.style.display='none'" />
  </header>

  <main class="container">
    <div class="top-bar">
      <button id="backBtn" class="back-nav-btn" style="display:none;" onclick="goBackStep()">← সব বিভাগ</button>
      <span id="statusInfo" class="status-info">পছন্দের বিভাগ বেছে নিন</span>
    </div>

    <!-- পছন্দের বিভাগ গ্রিড (শুরুতে এক সারিতে ৩টি; সিলেক্ট করলে বাম পাশে বড় ১টি ও ডান পাশে উপর-নিচে ছোট ২টি) -->
    <section id="categorySection">
      <div class="section-title">পছন্দের বিভাগ</div>
      <div id="categoryGrid" class="category-grid"></div>
    </section>

    <!-- দামের ভাগ -->
    <section id="priceSection" style="display:none;">
      <div class="section-title" id="priceHeading">দামের ভাগ</div>
      <div id="priceChips" class="filter-strip"></div>
    </section>

    <!-- ভেতরের ধরন ও প্রোডাক্ট তালিকা -->
    <section id="productSection" style="display:none;">
      <div class="section-title" id="typeHeading">ধরন অনুযায়ী দেখুন</div>
      <div id="typeChips" class="filter-strip"></div>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <!-- বড় করে দেখার ভিউ (Lightbox) -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
    <div class="lb-top">
      <span id="lbSerial" style="font-weight:700;"></span>
      <span id="lbSlideCounter" style="font-weight:700;">১ / ২</span>
    </div>

    <div class="lb-stage" id="lbStage">
      <button class="lb-nav-btn prev" onclick="changeLbSlide(-1)" aria-label="আগের ছবি">‹</button>
      <img id="lbImg" src="" alt="প্রোডাক্টের বড় ছবি" />
      <button class="lb-nav-btn next" onclick="changeLbSlide(1)" aria-label="পরের ছবি">›</button>
    </div>

    <div>
      <div class="lb-dots" id="lbDots"></div>

      <div class="lb-back-bottom-wrap">
        <button type="button" class="lb-back-btn" onclick="closeLightbox(true)">← ফিরে যান</button>
      </div>

      <div class="lb-footer">
        <div class="lb-info-row">
          <span id="lbTitle"></span>
          <span id="lbPrice" style="color:#fbbf24;"></span>
        </div>
        <button id="lbSelectBtn" class="select-btn"></button>
      </div>
    </div>
  </div>

  <!-- নিচের ফিক্সড বার (৫০% / ৫০%) -->
  <div id="stickyCartBar" class="sticky-cart-bar">
    <div class="cart-note-box">
      <img class="note-bg" src="images/cart-note.jpg" alt="" onerror="this.style.display='none'" />
      <div class="cart-note-overlay">
        <span id="liveCountBadge" class="live-count-badge">০</span>
        <span id="liveCountText" class="cart-note-text">পছন্দ হয়েছে, আরও বেছে নিতে পারেন</span>
      </div>
    </div>

    <button id="waOrderBtn" type="button" class="wa-img-btn" onclick="sendOrderToWhatsApp()" aria-label="WhatsApp-এ অর্ডার প্লেস করুন">
      <img
        src="images/wa-btn.png"
        alt="WhatsApp-এ অর্ডার প্লেস করুন"
        onload="if (this.nextElementSibling) this.nextElementSibling.style.display='none';"
        onerror="this.style.display='none';"
      />
      <span class="wa-fallback-label">WhatsApp-এ অর্ডার</span>
    </button>
  </div>

  <!-- এক্সিট কনফার্মেশন পপ-আপ -->
  <div id="exitModal" class="exit-modal" role="dialog" aria-modal="true">
    <div class="exit-card">
      <div class="exit-msg">
        আপনি যদি এখন বেরিয়ে যান, তবে সিলেক্ট করা প্রোডাক্টগুলো বাতিল হয়ে যাবে।
      </div>
      <div class="exit-actions">
        <button type="button" class="btn-stay" onclick="stayOnSite()">থেকে যাবো</button>
        <button type="button" class="btn-leave" onclick="confirmLeaveSite()">বেরিয়ে যাবো</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ১. কনফিগারেশন
    // ==========================================
    const CONFIG = {
      whatsappNumber: "919398452384",
      imageFolder: "images",
      // Google Sheet Publish to web (.csv) লিংকটি পরে এখানে কোটেশনের ভেতর বসাবেন
      googleSheetCsvUrl: ""
    };

    const CATEGORIES = [
      { id: "saree", name: "শাড়ি", image: "images/cat-saree.jpg" },
      { id: "blouse", name: "ব্লাউজ", image: "images/cat-blouse.jpg" },
      { id: "kurti", name: "কুর্তি", image: "images/cat-kurti.jpg" }
    ];

    const PRICE_FILTERS_BY_CAT = {
      saree: [
        { id: "all", label: "সব দাম", max: Infinity },
        { id: "under-300", label: "৩০০ টাকার মধ্যে", max: 300 },
        { id: "under-500", label: "৫০০ টাকার মধ্যে", max: 500 },
        { id: "under-700", label: "৭০০ টাকার মধ্যে", max: 700 },
        { id: "under-1000", label: "১০০০ টাকার মধ্যে", max: 1000 }
      ],
      kurti: [
        { id: "all", label: "সব দাম", max: Infinity },
        { id: "under-200", label: "২০০ টাকার মধ্যে", max: 200 },
        { id: "under-500", label: "৫০০ টাকার মধ্যে", max: 500 },
        { id: "under-700", label: "৭০০ টাকার মধ্যে", max: 700 }
      ],
      blouse: [
        { id: "all", label: "সব দাম", max: Infinity },
        { id: "under-200", label: "২০০ টাকার মধ্যে", max: 200 },
        { id: "under-500", label: "৫০০ টাকার মধ্যে", max: 500 },
        { id: "under-700", label: "৭০০ টাকার মধ্যে", max: 700 }
      ]
    };

    const DEFAULT_PRICE_FILTERS = [
      { id: "all", label: "সব দাম", max: Infinity },
      { id: "under-300", label: "৩০০ টাকার মধ্যে", max: 300 },
      { id: "under-500", label: "৫০০ টাকার মধ্যে", max: 500 },
      { id: "under-700", label: "৭০০ টাকার মধ্যে", max: 700 },
      { id: "under-1000", label: "১০০০ টাকার মধ্যে", max: 1000 }
    ];

    const SAMPLE_PRODUCTS = [
      { serial: "0001", category: "saree", type: "জামদানি", price: 450 },
      { serial: "0002", category: "saree", type: "বেনারসি", price: 680 },
      { serial: "0003", category: "saree", type: "জামদানি", price: 290 },
      { serial: "0004", category: "saree", type: "তাঁত", price: 890 },
      { serial: "0005", category: "kurti", type: "কটন কুর্তি", price: 190 },
      { serial: "0006", category: "kurti", type: "রেয়ন কুর্তি", price: 480 },
      { serial: "0007", category: "blouse", type: "কটন ব্লাউজ", price: 180 },
      { serial: "0008", category: "blouse", type: "ডিজাইনার ব্লাউজ", price: 490 }
    ];

    // ==========================================
    // ২. হালকা সাউন্ড এফেক্ট
    // ==========================================
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTingSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(1046.5, now);
        osc.frequency.exponentialRampToValueAtTime(1318.5, now + 0.08);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.06, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {}
    }

    function playFirstWaNoticeSound() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        [880, 1174.66].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + idx * 0.09;

          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.055, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.24);
        });
      } catch (e) {}
    }

    // ==========================================
    // ৩. সেশন স্টেট ও হেল্পার ফাংশন
    // ==========================================
    let allProducts = [...SAMPLE_PRODUCTS];
    let currentCategory = null;
    let currentPriceFilter = DEFAULT_PRICE_FILTERS[0];
    let currentTypeFilter = "all";
    const selectedMap = new Map();
    let hasPlayedFirstWaAnimation = false;

    let lbProduct = null;
    let lbSlideIndex = 0;
    let lbOpenedFromHistory = false;
    let ignoreNextPopstate = false;
    let exitPromptArmed = false;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function toBengaliNumber(num) {
      const bnDigits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
      return String(num).replace(/\d/g, (d) => bnDigits[Number(d)]);
    }

    function parsePriceValue(raw) {
      const bnMap = { "০": "0", "১": "1", "২": "2", "৩": "3", "৪": "4", "৫": "5", "৬": "6", "৭": "7", "৮": "8", "৯": "9" };
      const normalized = String(raw || "")
        .replace(/[০-৯]/g, (ch) => bnMap[ch])
        .replace(/[^\d.]/g, "");
      const val = Number(normalized);
      return Number.isFinite(val) && val > 0 ? val : 0;
    }

    function normalizeCategoryId(rawCat) {
      const c = String(rawCat || "").trim().toLowerCase();
      if (c === "saree" || c === "sari" || c === "শাড়ি" || c === "শাড়ি") return "saree";
      if (c === "kurti" || c === "কুর্তি") return "kurti";
      if (c === "blouse" || c === "ব্লাউজ") return "blouse";
      return c;
    }

    function getActivePriceFilters() {
      return PRICE_FILTERS_BY_CAT[currentCategory] || DEFAULT_PRICE_FILTERS;
    }

    function getProductImages(serial) {
      return [
        `${CONFIG.imageFolder}/${serial}-1.jpg`,
        `${CONFIG.imageFolder}/${serial}-2.jpg`
      ];
    }

    function setButtonSelectedState(btn, isSelected) {
      if (!btn) return;
      btn.classList.toggle("is-selected", isSelected);
      if (isSelected) {
        btn.innerHTML = `<span class="red-tick">✔</span> পছন্দ করা হয়েছে`;
      } else {
        btn.textContent = "পছন্দ করুন";
      }
    }

    // ==========================================
    // ৪. রেন্ডারিং ফাংশনসমূহ
    // ==========================================
    function renderCategories() {
      const grid = document.getElementById("categoryGrid");
      grid.innerHTML = "";
      grid.classList.toggle("is-split", Boolean(currentCategory));

      const orderedCategories = currentCategory
        ? [
            ...CATEGORIES.filter((c) => c.id === currentCategory),
            ...CATEGORIES.filter((c) => c.id !== currentCategory)
          ]
        : CATEGORIES;

      orderedCategories.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-card" + (currentCategory === cat.id ? " active" : "");
        btn.onclick = () => selectCategory(cat.id);

        const img = document.createElement("img");
        img.src = cat.image;
        img.alt = cat.name;
        img.loading = "lazy";
        img.onerror = function () {
          this.style.display = "none";
        };

        const label = document.createElement("div");
        label.className = "cat-label";
        label.textContent = cat.name;

        btn.appendChild(img);
        btn.appendChild(label);
        grid.appendChild(btn);
      });
    }

    function selectCategory(catId) {
      currentCategory = catId;
      const filters = getActivePriceFilters();
      currentPriceFilter = filters[0];
      currentTypeFilter = "all";

      const catObj = CATEGORIES.find((c) => c.id === catId);
      document.getElementById("backBtn").style.display = "inline-block";
      document.getElementById("statusInfo").textContent = catObj ? `বিভাগ: ${catObj.name}` : "";
      document.getElementById("priceSection").style.display = "block";
      document.getElementById("productSection").style.display = "block";

      renderCategories();
      renderPriceChips();
      renderTypeChipsAndProducts();
    }

    function renderPriceChips() {
      const container = document.getElementById("priceChips");
      container.innerHTML = "";
      const filters = getActivePriceFilters();
      filters.forEach((pf) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "filter-chip" + (currentPriceFilter.id === pf.id ? " active" : "");
        chip.textContent = pf.label;
        chip.onclick = () => {
          currentPriceFilter = pf;
          currentTypeFilter = "all";
          renderPriceChips();
          renderTypeChipsAndProducts();
        };
        container.appendChild(chip);
      });
    }

    function getProductsInCategoryAndPrice() {
      return allProducts.filter(
        (p) => p.category === currentCategory && Number(p.price) <= currentPriceFilter.max
      );
    }

    function renderTypeChipsAndProducts() {
      const baseList = getProductsInCategoryAndPrice();
      const types = ["all", ...new Set(baseList.map((p) => p.type).filter(Boolean))];

      if (!types.includes(currentTypeFilter)) {
        currentTypeFilter = "all";
      }

      const typeContainer = document.getElementById("typeChips");
      typeContainer.innerHTML = "";
      types.forEach((t) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "filter-chip" + (currentTypeFilter === t ? " active" : "");
        chip.textContent = t === "all" ? "সব ধরন" : t;
        chip.onclick = () => {
          currentTypeFilter = t;
          renderTypeChipsAndProducts();
        };
        typeContainer.appendChild(chip);
      });

      const finalList =
        currentTypeFilter === "all"
          ? baseList
          : baseList.filter((p) => p.type === currentTypeFilter);

      renderProducts(finalList);
    }

    function renderProducts(list) {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      if (!list.length) {
        grid.innerHTML = `<div class="empty-box" style="grid-column: 1 / -1;">এই ভাগে আপাতত কোনো প্রোডাক্ট নেই।</div>`;
        return;
      }

      list.forEach((prod) => {
        const isSelected = selectedMap.has(prod.serial);
        const imgs = getProductImages(prod.serial);

        const card = document.createElement("article");
        card.className = "product-card";

        const imgWrap = document.createElement("div");
        imgWrap.className = "img-single-wrap";
        imgWrap.onclick = () => openLightbox(prod, 0);

        const mainImg = document.createElement("img");
        mainImg.src = imgs[0];
        mainImg.alt = `${prod.type} (${prod.serial})`;
        mainImg.loading = "lazy";

        const badge = document.createElement("span");
        badge.className = "two-photo-badge";
        badge.textContent = "২টি ছবি আছে";

        imgWrap.appendChild(mainImg);
        imgWrap.appendChild(badge);

        const body = document.createElement("div");
        body.className = "prod-body";
        body.onclick = (e) => {
          if (e.target.closest(".select-btn")) return;
          toggleSelect(prod.serial);
        };

        const topLine = document.createElement("div");
        topLine.className = "prod-top-line";
        topLine.innerHTML = `<span class="prod-code-text">কোড: ${escapeHtml(prod.serial)}</span><span class="prod-price-inline">₹${toBengaliNumber(prod.price)}</span>`;

        const typeEl = document.createElement("div");
        typeEl.className = "prod-type";
        typeEl.textContent = prod.type || "কালেকশন";

        const selBtn = document.createElement("button");
        selBtn.type = "button";
        selBtn.className = "select-btn";
        setButtonSelectedState(selBtn, isSelected);
        selBtn.onclick = (e) => {
          e.stopPropagation();
          toggleSelect(prod.serial);
        };

        body.appendChild(topLine);
        body.appendChild(typeEl);
        body.appendChild(selBtn);

        card.appendChild(imgWrap);
        card.appendChild(body);
        grid.appendChild(card);
      });
    }

    function goBackStep() {
      currentCategory = null;
      document.getElementById("backBtn").style.display = "none";
      document.getElementById("statusInfo").textContent = "পছন্দের বিভাগ বেছে নিন";
      document.getElementById("priceSection").style.display = "none";
      document.getElementById("productSection").style.display = "none";
      renderCategories();
    }

    // ==========================================
    // ৫. পছন্দ করা, সাউন্ড ও নিচের ফিক্সড বার আপডেট
    // ==========================================
    function toggleSelect(serial) {
      const prod = allProducts.find((p) => p.serial === serial);
      if (!prod) return;

      if (selectedMap.has(serial)) {
        selectedMap.delete(serial);
        syncSelectButtonsUI();
        updateStickyCartBar(false);
      } else {
        selectedMap.set(serial, prod);
        armExitGuard();
        playTingSound();
        syncSelectButtonsUI();
        updateStickyCartBar(true);
      }
    }

    function syncSelectButtonsUI() {
      const cards = document.querySelectorAll(".product-card");
      const currentList =
        currentTypeFilter === "all"
          ? getProductsInCategoryAndPrice()
          : getProductsInCategoryAndPrice().filter((p) => p.type === currentTypeFilter);

      cards.forEach((card, idx) => {
        const prod = currentList[idx];
        if (!prod) return;
        const btn = card.querySelector(".select-btn");
        setButtonSelectedState(btn, selectedMap.has(prod.serial));
      });

      if (lbProduct) {
        const lbBtn = document.getElementById("lbSelectBtn");
        setButtonSelectedState(lbBtn, selectedMap.has(lbProduct.serial));
      }
    }

    function updateStickyCartBar(wasAdded) {
      const bar = document.getElementById("stickyCartBar");
      const count = selectedMap.size;

      if (count <= 0) {
        bar.classList.remove("visible");
        return;
      }

      bar.classList.add("visible");
      document.getElementById("liveCountBadge").textContent = toBengaliNumber(count);
      document.getElementById("liveCountText").textContent =
        `${toBengaliNumber(count)}টি পছন্দ হয়েছে, আরও বেছে নিতে পারেন`;

      if (wasAdded && !hasPlayedFirstWaAnimation) {
        hasPlayedFirstWaAnimation = true;
        const waBtn = document.getElementById("waOrderBtn");
        waBtn.classList.remove("first-pop-shake");
        void waBtn.offsetWidth;
        waBtn.classList.add("first-pop-shake");
        setTimeout(() => {
          playFirstWaNoticeSound();
        }, 120);
      }
    }

    // ==========================================
    // ৬. বড় করে দেখার ভিউ (Lightbox)
    // ==========================================
    function openLightbox(prod, startIdx = 0) {
      lbProduct = prod;
      lbSlideIndex = startIdx;

      document.getElementById("lbSerial").textContent = `কোড: ${prod.serial}`;
      document.getElementById("lbTitle").textContent = prod.type || "কালেকশন";
      document.getElementById("lbPrice").textContent = `₹${toBengaliNumber(prod.price)}`;

      const lbBtn = document.getElementById("lbSelectBtn");
      setButtonSelectedState(lbBtn, selectedMap.has(prod.serial));
      lbBtn.onclick = () => toggleSelect(prod.serial);

      renderLightboxSlide();
      document.getElementById("lightbox").classList.add("open");

      try {
        history.pushState({ modal: "lightbox" }, "");
        lbOpenedFromHistory = true;
      } catch (e) {}
    }

    function renderLightboxSlide() {
      if (!lbProduct) return;
      const imgs = getProductImages(lbProduct.serial);
      const total = imgs.length;
      if (lbSlideIndex < 0) lbSlideIndex = total - 1;
      if (lbSlideIndex >= total) lbSlideIndex = 0;

      document.getElementById("lbImg").src = imgs[lbSlideIndex];
      document.getElementById("lbSlideCounter").textContent =
        `${toBengaliNumber(lbSlideIndex + 1)} / ${toBengaliNumber(total)}`;

      const dotsWrap = document.getElementById("lbDots");
      dotsWrap.innerHTML = "";
      imgs.forEach((_, idx) => {
        const dot = document.createElement("span");
        dot.className = "lb-dot" + (idx === lbSlideIndex ? " active" : "");
        dotsWrap.appendChild(dot);
      });
    }

    function changeLbSlide(delta) {
      lbSlideIndex += delta;
      renderLightboxSlide();
    }

    function closeLightbox(fromButton) {
      const lb = document.getElementById("lightbox");
      if (!lb.classList.contains("open")) return;
      lb.classList.remove("open");
      lbProduct = null;

      if (fromButton && lbOpenedFromHistory) {
        lbOpenedFromHistory = false;
        ignoreNextPopstate = true;
        history.back();
      } else {
        lbOpenedFromHistory = false;
      }
    }

    let touchStartX = 0;
    const lbStageEl = document.getElementById("lbStage");
    lbStageEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });
    lbStageEl.addEventListener("touchend", (e) => {
      const diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) > 40) {
        changeLbSlide(diff < 0 ? 1 : -1);
      }
    }, { passive: true });

    // ==========================================
    // ৭. WhatsApp-এ সরাসরি অর্ডার পাঠানো
    // ==========================================
    function sendOrderToWhatsApp() {
      if (selectedMap.size === 0) return;

      const lines = ["নমস্কার! আমি নিচের কালেকশনগুলো অর্ডার করতে চাই:", ""];
      let idx = 1;
      let totalAmount = 0;

      selectedMap.forEach((prod) => {
        const catObj = CATEGORIES.find((c) => c.id === prod.category);
        const catName = catObj ? catObj.name : prod.category;
        lines.push(`${toBengaliNumber(idx)}. কোড: ${prod.serial} | ${catName} (${prod.type}) — ₹${toBengaliNumber(prod.price)}`);
        totalAmount += Number(prod.price) || 0;
        idx++;
      });

      lines.push("");
      lines.push(`মোট পছন্দ: ${toBengaliNumber(selectedMap.size)}টি`);
      lines.push(`আনুমানিক মোট মূল্য: ₹${toBengaliNumber(totalAmount)}`);

      const message = encodeURIComponent(lines.join("\n"));
      const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${message}`;
      window.open(waUrl, "_blank");
    }

    // ==========================================
    // ৮. এক্সিট গার্ড (কার্টে আইটেম থাকলে পপ-আপ)
    // ==========================================
    function armExitGuard() {
      if (exitPromptArmed) return;
      exitPromptArmed = true;
      try {
        history.pushState({ guard: "exit" }, "");
      } catch (e) {}
    }

    function stayOnSite() {
      document.getElementById("exitModal").classList.remove("open");
      try {
        history.pushState({ guard: "exit" }, "");
      } catch (e) {}
    }

    function confirmLeaveSite() {
      document.getElementById("exitModal").classList.remove("open");
      selectedMap.clear();
      exitPromptArmed = false;
      history.back();
    }

    window.addEventListener("popstate", () => {
      if (ignoreNextPopstate) {
        ignoreNextPopstate = false;
        return;
      }

      const lb = document.getElementById("lightbox");
      if (lb.classList.contains("open")) {
        lbOpenedFromHistory = false;
        closeLightbox(false);
        return;
      }

      if (selectedMap.size > 0) {
        document.getElementById("exitModal").classList.add("open");
      }
    });

    window.addEventListener("beforeunload", (e) => {
      if (selectedMap.size > 0) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    // ==========================================
    // ৯. Google Sheet CSV লোডার
    // ==========================================
    function parseCsvLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    async function loadProductsFromSheet() {
      if (!CONFIG.googleSheetCsvUrl) return;
      try {
        const res = await fetch(CONFIG.googleSheetCsvUrl, { cache: "no-store" });
        if (!res.ok) return;
        const text = await res.text();
        const rows = text
          .split(/\r?\n/)
          .map((r) => r.trim())
          .filter(Boolean);

        if (rows.length < 2) return;

        const headers = parseCsvLine(rows[0]).map((h) => h.toLowerCase());
        const serialIdx = headers.indexOf("serial");
        const catIdx = headers.indexOf("category");
        const typeIdx = headers.indexOf("type");
        const priceIdx = headers.indexOf("price");

        if (serialIdx === -1 || catIdx === -1 || priceIdx === -1) return;

        const parsed = [];
        for (let i = 1; i < rows.length; i++) {
          const cols = parseCsvLine(rows[i]);
          const serial = (cols[serialIdx] || "").trim();
          const category = normalizeCategoryId(cols[catIdx]);
          const type = typeIdx !== -1 ? (cols[typeIdx] || "").trim() : "কালেকশন";
          const price = parsePriceValue(cols[priceIdx]);

          if (serial && category && price > 0) {
            parsed.push({ serial, category, type, price });
          }
        }

        if (parsed.length > 0) {
          allProducts = parsed;
          if (currentCategory) {
            renderTypeChipsAndProducts();
          }
        }
      } catch (err) {
        console.warn("Google Sheet লোড হতে সমস্যা হয়েছে, ডেমো ডেটা দেখানো হচ্ছে:", err);
      }
    }

    // পেজ শুরু হলে রেন্ডার
    renderCategories();
    loadProductsFromSheet();
  </script>
</body>
